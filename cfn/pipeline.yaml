AWSTemplateFormatVersion: "2010-09-09"

Description: S3 -> Lambda schema validation -> Glue ETL pipeline.

Parameters:
  BucketName:
    Type: String
    Default: ""
    Description: Optional globally unique S3 bucket name. Leave empty to generate one.

Conditions:
  HasBucketName: !Not
    - !Equals
      - !Ref BucketName
      - ""

Resources:

  # ===========================================================================
  # S3 BUCKET
  # ===========================================================================

  PipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - HasBucketName
        - !Ref BucketName
        - !Ref AWS::NoValue

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ===========================================================================
  # LAMBDA EXECUTION ROLE
  # ===========================================================================

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: LambdaRuntime
          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::*/*"

              - Effect: Allow
                Action:
                  - glue:StartJobRun
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${AWS::StackName}-etl"

  # ===========================================================================
  # MAIN LAMBDA FUNCTION
  # ===========================================================================

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-schema-validator"

      Runtime: python3.12

      Handler: handler.handler

      Role: !GetAtt LambdaRole.Arn

      Timeout: 60

      MemorySize: 256

      Environment:
        Variables:
          GLUE_JOB_NAME: !Sub "${AWS::StackName}-etl"
          OUTPUT_PREFIX: output/
          REQUIRED_COLUMNS: city,state,country

      Code:
        ZipFile: |
          def handler(event, context):
              raise RuntimeError(
                  "Placeholder Lambda. GitHub Actions uploads the real Lambda package."
              )

  # ===========================================================================
  # PERMISSION FOR S3 TO INVOKE MAIN LAMBDA
  # ===========================================================================

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName: !Ref LambdaFunction

      Action: lambda:InvokeFunction

      Principal: s3.amazonaws.com

      SourceArn: !GetAtt PipelineBucket.Arn

      SourceAccount: !Ref AWS::AccountId

  # ===========================================================================
  # ROLE USED BY THE CUSTOM RESOURCE
  # ===========================================================================

  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-notification"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: ConfigureS3Notification
          PolicyDocument:
            Version: "2012-10-17"

            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                Resource:
                  - !GetAtt PipelineBucket.Arn

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # ===========================================================================
  # CUSTOM RESOURCE LAMBDA
  # ===========================================================================
  #
  # This Lambda configures the S3 -> Lambda notification only AFTER:
  #
  #   1. S3 bucket exists
  #   2. Main Lambda exists
  #   3. S3 invoke permission exists
  #
  # This avoids the CloudFormation/S3 circular dependency.
  # ===========================================================================

  NotificationFunction:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub "${AWS::StackName}-s3-notification"

      Runtime: python3.12

      Handler: index.handler

      Role: !GetAtt NotificationRole.Arn

      Timeout: 60

      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          s3 = boto3.client("s3")

          def send_response(event, context, status, data, physical_id):
              response_body = json.dumps({
                  "Status": status,
                  "Reason": "See CloudWatch Log Stream: " + context.log_stream_name,
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False,
                  "Data": data
              })

              response_url = event["ResponseURL"]

              request = urllib.request.Request(
                  response_url,
                  data=response_body.encode("utf-8"),
                  headers={
                      "content-type": "",
                      "content-length": str(len(response_body))
                  },
                  method="PUT"
              )

              with urllib.request.urlopen(request) as response:
                  response.read()

          def handler(event, context):
              bucket = event["ResourceProperties"]["BucketName"]
              function_arn = event["ResourceProperties"]["FunctionArn"]

              physical_id = f"{bucket}-lambda-notification"

              try:
                  request_type = event["RequestType"]

                  if request_type in ("Create", "Update"):
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={
                              "LambdaFunctionConfigurations": [
                                  {
                                      "LambdaFunctionArn": function_arn,
                                      "Events": [
                                          "s3:ObjectCreated:*"
                                      ],
                                      "Filter": {
                                          "Key": {
                                              "FilterRules": [
                                                  {
                                                      "Name": "prefix",
                                                      "Value": "landing/"
                                                  },
                                                  {
                                                      "Name": "suffix",
                                                      "Value": ".csv"
                                                  }
                                              ]
                                          }
                                      }
                                  }
                              ]
                          }
                      )

                  elif request_type == "Delete":
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )

                  send_response(
                      event,
                      context,
                      "SUCCESS",
                      {
                          "BucketName": bucket
                      },
                      physical_id
                  )

              except Exception as error:
                  print("ERROR:", str(error))

                  send_response(
                      event,
                      context,
                      "FAILED",
                      {
                          "Error": str(error)
                      },
                      physical_id
                  )

  # ===========================================================================
  # CUSTOM RESOURCE
  # ===========================================================================

  ConfigureS3Notification:
    Type: Custom::S3LambdaNotification

    DependsOn:
      - LambdaInvokePermission

    Properties:
      ServiceToken: !GetAtt NotificationFunction.Arn

      BucketName: !Ref PipelineBucket

      FunctionArn: !GetAtt LambdaFunction.Arn

  # ===========================================================================
  # GLUE EXECUTION ROLE
  # ===========================================================================

  GlueRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub "${AWS::StackName}-glue"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole

      Policies:
        - PolicyName: S3DataAccess

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::*"
                  - !Sub "arn:${AWS::Partition}:s3:::*/*"

              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::*"
                  - !Sub "arn:${AWS::Partition}:s3:::*/*"

  # ===========================================================================
  # GLUE JOB
  # ===========================================================================

  GlueJob:
    Type: AWS::Glue::Job

    Properties:
      Name: !Sub "${AWS::StackName}-etl"

      Role: !GetAtt GlueRole.Arn

      GlueVersion: "4.0"

      WorkerType: G.1X

      NumberOfWorkers: 2

      ExecutionProperty:
        MaxConcurrentRuns: 2

      Command:
        Name: glueetl

        PythonVersion: "3"

        ScriptLocation: !Sub "s3://${PipelineBucket}/glue/job.py"

      DefaultArguments:
        "--job-language": "python"
        "--enable-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:

  BucketName:
    Description: Pipeline S3 bucket.
    Value: !Ref PipelineBucket

  LambdaName:
    Description: Schema validation Lambda.
    Value: !Ref LambdaFunction

  GlueJobName:
    Description: Glue ETL job.
    Value: !Ref GlueJob